spring:
  application:
    name: exhibitor-system
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/exhibitor}
    username: ${SPRING_DATASOURCE_USERNAME:exhibitor}
    password: ${SPRING_DATASOURCE_PASSWORD:exhibitor}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${app.db.schema}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: ${SPRING_REDIS_TIMEOUT:2s}
app:
  db:
    schema: ${APP_DB_SCHEMA:exhibitor_sys}
    seed-demo-data: ${APP_DB_SEED_DEMO_DATA:false}
  file-storage:
    root-path: ${APP_FILE_STORAGE_ROOT:./tmp/uploads}
    public-prefix: ${APP_FILE_STORAGE_PUBLIC_PREFIX:/uploads}
  scene:
    cad:
      dwg-enabled: ${APP_SCENE_CAD_DWG_ENABLED:true}
      dxf-enabled: ${APP_SCENE_CAD_DXF_ENABLED:true}
      converter-target-format: SVG
      work-dir: ${APP_SCENE_CAD_WORK_DIR:${user.dir}/tmp/cad}
      external-command: ${APP_SCENE_CAD_EXTERNAL_COMMAND:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    jwt-secret: ${JWT_SECRET:dGhpcy1pcy1vbmx5LWZvci1kZXYtZW52LXBsZWFzZS1yZXBsYWNlLWluLXByb2R1Y3Rpb24=}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
    jwt-issuer: ${JWT_ISSUER:sport-expo-exhibitor-system}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
server:
  port: ${PORT:${SERVER_PORT:8080}}
