services:
  - type: web
    name: sport-expo-exhibitor-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_DB_SCHEMA
        value: exhibitor_sys
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://sport-expo-exhibitor-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: sport-expo-exhibitor-db
          property: connectionString
      - key: SPRING_REDIS_HOST
        fromService:
          type: keyvalue
          name: sport-expo-exhibitor-cache
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: keyvalue
          name: sport-expo-exhibitor-cache
          property: port

  - type: web
    name: sport-expo-exhibitor-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sport-expo-exhibitor-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: sport-expo-exhibitor-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: sport-expo-exhibitor-db
    plan: free
    databaseName: exhibitor
    user: exhibitor
    ipAllowList: []
